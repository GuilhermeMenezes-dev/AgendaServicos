<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tipos de acesso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container mt-4">
<h1 class="mb-4" th:text="${tipoAcesso.id == null ? 'Novo tipo de acesso' : 'Editar tipo de acesso'}"></h1>
    <div th:replace="~{fragments :: alertas}"></div>
    <form th:action="@{/tipos-acesso}" th:object="${tipoAcesso}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <input type="text" class="form-control" th:field="*{descricao}">
            <div class="text-danger small" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="@{/tipos-acesso}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
</body>
</html>
