<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agendamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container mt-4">
<h1 class="mb-4" th:text="${agenda.id == null ? 'Novo agendamento' : 'Editar agendamento'}"></h1>
    <div th:replace="~{fragments :: alertas}"></div>
    <form th:action="@{/agendamentos}" th:object="${agenda}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <input type="text" class="form-control" th:field="*{descricao}">
            <div class="text-danger small" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Serviço</label>
            <select class="form-select" name="servico">
                <option value="">Selecione</option>
                <option th:each="o : ${servicos}" th:value="${o.id}" th:text="${o.nome + ' - R$ ' + #numbers.formatDecimal(o.valor,1,'POINT',2,'COMMA')}"
                        th:selected="${agenda.servico != null and agenda.servico.id == o.id}"></option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('servico')}" th:errors="*{servico}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Data e hora</label>
            <input type="datetime-local" class="form-control" th:field="*{data}">
            <div class="text-danger small" th:if="${#fields.hasErrors('data')}" th:errors="*{data}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <select class="form-select" name="cliente">
                <option value="">Selecione</option>
                <option th:each="o : ${clientes}" th:value="${o.id}" th:text="${o.nome}"
                        th:selected="${agenda.cliente != null and agenda.cliente.id == o.id}"></option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Usuário</label>
            <select class="form-select" name="usuario">
                <option value="">Selecione</option>
                <option th:each="o : ${usuarios}" th:value="${o.id}" th:text="${o.usuario}"
                        th:selected="${agenda.usuario != null and agenda.usuario.id == o.id}"></option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('usuario')}" th:errors="*{usuario}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="@{/agendamentos}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
</body>
</html>
