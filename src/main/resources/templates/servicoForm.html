<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Serviços</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container mt-4">
<h1 class="mb-4" th:text="${servico.id == null ? 'Novo serviço' : 'Editar serviço'}"></h1>
    <div th:replace="~{fragments :: alertas}"></div>
    <form th:action="@{/servicos}" th:object="${servico}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" th:field="*{nome}">
            <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Valor (R$)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{valor}">
            <div class="text-danger small" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="@{/servicos}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
</body>
</html>
