<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Endereços</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container mt-4">
<h1 class="mb-4" th:text="${endereco.id == null ? 'Novo endereço' : 'Editar endereço'}"></h1>
    <div th:replace="~{fragments :: alertas}"></div>
    <form th:action="@{/enderecos}" th:object="${endereco}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Logradouro</label>
            <input type="text" class="form-control" th:field="*{logradouro}">
            <div class="text-danger small" th:if="${#fields.hasErrors('logradouro')}" th:errors="*{logradouro}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">UF</label>
            <input type="text" class="form-control" th:field="*{uf}">
            <div class="text-danger small" th:if="${#fields.hasErrors('uf')}" th:errors="*{uf}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Estado</label>
            <input type="text" class="form-control" th:field="*{estado}">
            <div class="text-danger small" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">CEP</label>
            <input type="text" class="form-control" th:field="*{cep}">
            <div class="text-danger small" th:if="${#fields.hasErrors('cep')}" th:errors="*{cep}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Cidade</label>
            <input type="text" class="form-control" th:field="*{cidade}">
            <div class="text-danger small" th:if="${#fields.hasErrors('cidade')}" th:errors="*{cidade}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Número</label>
            <input type="number" class="form-control" th:field="*{numero}">
            <div class="text-danger small" th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Complemento</label>
            <input type="text" class="form-control" th:field="*{complemento}">
            <div class="text-danger small" th:if="${#fields.hasErrors('complemento')}" th:errors="*{complemento}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="@{/enderecos}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
</body>
</html>
