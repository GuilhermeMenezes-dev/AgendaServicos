<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Usuários</h1>
        <a th:href="@{/usuarios/novo}" class="btn btn-primary">+ Novo</a>
    </div>
    <div th:replace="~{fragments :: alertas}"></div>
    <div class="card"><div class="table-responsive"><table class="table table-hover mb-0">
        <thead><tr><th>ID</th><th>Usuário</th><th>Tipo de acesso</th><th>Cadastro</th><th>Ações</th></tr></thead>
        <tbody>
            <tr th:each="i : ${lista}">
                <td th:text="${i.id}"></td>
                <td th:text="${i.usuario}"></td>
                <td th:text="${i.tipoAcesso != null ? i.tipoAcesso.descricao : '-'}"></td>
                <td th:text="${i.dtCadastroFormatada}"></td>
                <td class="d-flex gap-2">
                    <a th:href="@{/usuarios/{id}/editar(id=${i.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <form th:action="@{/usuarios/excluir/{id}(id=${i.id})}" method="post" onsubmit="return confirm('Excluir este registro?')">
                        <button type="submit" class="btn btn-sm btn-danger">Excluir</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table></div></div>
</div>
</body>
</html>
