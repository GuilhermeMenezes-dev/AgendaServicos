<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agendamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Agendamentos</h1>
        <a href="/agendamentos/novo" class="btn btn-primary">+ Novo agendamento</a>
    </div>
    <div th:replace="~{fragments :: alertas}"></div>
    <form method="get" action="/agendamentos" class="card card-body mb-3">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label">Cliente</label>
                <select class="form-select" name="cliente">
                    <option value="">Todos</option>
                    <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"
                            th:selected="${fCliente != null and fCliente == c.id}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Serviço</label>
                <select class="form-select" name="servico">
                    <option value="">Todos</option>
                    <option th:each="s : ${servicos}" th:value="${s.id}" th:text="${s.nome}"
                            th:selected="${fServico != null and fServico == s.id}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">De</label>
                <input type="date" class="form-control" name="de" th:value="${fDe}">
            </div>
            <div class="col-md-2">
                <label class="form-label">Até</label>
                <input type="date" class="form-control" name="ate" th:value="${fAte}">
            </div>
            <div class="col-md-2 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Pesquisar</button>
                <a href="/agendamentos" class="btn btn-secondary">Limpar</a>
            </div>
        </div>
    </form>
    <div class="card"><div class="table-responsive"><table class="table table-hover mb-0">
        <thead><tr><th>ID</th><th>Data e hora</th><th>Descrição</th><th>Cliente</th><th>Serviço</th><th>Valor</th><th>Usuário</th><th>Ações</th></tr></thead>
        <tbody>
            <tr th:each="i : ${lista}">
                <td th:text="${i.id}"></td>
                <td th:text="${i.dataFormatada}"></td>
                <td th:text="${i.descricao}"></td>
                <td th:text="${i.cliente.nome}"></td>
                <td th:text="${i.servico.nome}"></td>
                <td th:text="${'R$ ' + #numbers.formatDecimal(i.servico.valor,1,'POINT',2,'COMMA')}"></td>
                <td th:text="${i.usuario.usuario}"></td>
                <td class="d-flex gap-2">
                    <a th:href="@{/agendamentos/{id}/editar(id=${i.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <form th:action="@{/agendamentos/excluir/{id}(id=${i.id})}" method="post" onsubmit="return confirm('Excluir este agendamento?')">
                        <button type="submit" class="btn btn-sm btn-danger">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(lista)}"><td colspan="8" class="text-center text-muted">Nenhum agendamento encontrado.</td></tr>
        </tbody>
    </table></div></div>
</div>
</body>
</html>
