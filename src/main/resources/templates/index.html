<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container mt-4">
    <h1 class="mb-4">Dashboard</h1>
    <div class="row g-3">
        <div class="col-md-4"><div class="card"><div class="card-body">
            <div class="text-muted">Agendamentos</div>
            <div class="display-6" th:text="${totalAgendamentos}"></div>
        </div></div></div>
        <div class="col-md-4"><div class="card"><div class="card-body">
            <div class="text-muted">Faturamento previsto</div>
            <div class="display-6" th:text="${'R$ ' + #numbers.formatDecimal(faturamento,1,'POINT',2,'COMMA')}"></div>
        </div></div></div>
        <div class="col-md-4"><div class="card"><div class="card-body">
            <div class="text-muted">Clientes cadastrados</div>
            <div class="display-6" th:text="${totalClientes}"></div>
        </div></div></div>
    </div>
</div>
</body>
</html>
